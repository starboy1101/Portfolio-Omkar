    <title>Omkar Mahabdi | AI/ML Engineer & Python Developer</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch {
        // The app theme provider applies the fallback after hydration.
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-width: 320px;
        background: #f8fafc;
      }

      .dark body {
        background: #030712;
      }

      .portfolio-boot {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        box-sizing: border-box;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(circle at 50% 35%, rgb(99 102 241 / 0.12), transparent 24rem),
          #f8fafc;
        color: #0f172a;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .dark .portfolio-boot {
        background:
          radial-gradient(circle at 50% 35%, rgb(99 102 241 / 0.2), transparent 24rem),
          #030712;
        color: #f1f5f9;
      }

      .portfolio-boot__content {
        width: min(100%, 28rem);
        text-align: center;
        animation: portfolio-boot-enter 360ms ease-out both;
      }

      .portfolio-boot__mark {
        position: relative;
        display: grid;
        width: 5rem;
        height: 5rem;
        margin-inline: auto;
        place-items: center;
        border: 1px solid #c7d2fe;
        border-radius: 1.5rem;
        background: rgb(255 255 255 / 0.9);
        box-shadow: 0 20px 45px -24px rgb(49 46 129 / 0.45);
        color: #4f46e5;
        font-size: 1.5rem;
        font-weight: 750;
        letter-spacing: -0.04em;
      }

      .portfolio-boot__mark::after {
        position: absolute;
        top: -0.35rem;
        right: -0.25rem;
        width: 0.75rem;
        height: 0.75rem;
        border: 3px solid #f8fafc;
        border-radius: 999px;
        background: #6366f1;
        content: "";
      }

      .dark .portfolio-boot__mark {
        border-color: rgb(99 102 241 / 0.45);
        background: rgb(15 23 42 / 0.92);
        color: #a5b4fc;
      }

      .dark .portfolio-boot__mark::after {
        border-color: #030712;
      }

      .portfolio-boot h1 {
        margin: 1.75rem 0 0;
        font-size: clamp(1.5rem, 5vw, 2rem);
        line-height: 1.2;
        letter-spacing: -0.025em;
      }

      .portfolio-boot p {
        margin: 0.75rem auto 0;
        color: #475569;
        line-height: 1.7;
      }

      .dark .portfolio-boot p {
        color: #cbd5e1;
      }

      .portfolio-boot__status {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin-top: 1.75rem;
        padding: 0.6rem 0.9rem;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.75);
        color: #475569;
        font-size: 0.875rem;
        font-weight: 650;
      }

      .dark .portfolio-boot__status {
        border-color: #334155;
        background: rgb(15 23 42 / 0.75);
        color: #cbd5e1;
      }

      .portfolio-boot__spinner {
        width: 1rem;
        height: 1rem;
        box-sizing: border-box;
        border: 2px solid rgb(99 102 241 / 0.25);
        border-top-color: #6366f1;
        border-radius: 999px;
        animation: portfolio-boot-spin 750ms linear infinite;
      }

      @keyframes portfolio-boot-enter {
        from {
          opacity: 0;
          transform: translateY(0.4rem);
        }
      }

      @keyframes portfolio-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .portfolio-boot__content,
        .portfolio-boot__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="portfolio-boot" role="status" aria-live="polite" aria-busy="true">
        <div class="portfolio-boot__content">
          <div class="portfolio-boot__mark" aria-hidden="true">OM</div>
          <h1>Loading Omkar Mahabdi's portfolio</h1>
          <p>Preparing AI/ML engineering, Python, RAG, and full-stack project highlights.</p>
          <div class="portfolio-boot__status">
            <span class="portfolio-boot__spinner" aria-hidden="true"></span>
            Preparing the experience&hellip;
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
